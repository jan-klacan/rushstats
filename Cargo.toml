[package]
name = "rushstats-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Rust statistical engine for the rushstats Python CLI"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
csv = "1.4"
pyo3 = { version = "0.29.2", features = ["abi3-py310"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
