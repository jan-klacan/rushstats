name: Feature request
description: Suggest a statistical analysis or workflow improvement.
body:
  - type: textarea
    id: need
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include a CLI/API example and statistical conventions where relevant.
    validations:
      required: true
