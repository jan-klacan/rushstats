name: Distribution builds
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  wheels:
    name: Wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            container: quay.io/pypa/manylinux2014_x86_64:latest
            interpreter: /opt/python/cp310-cp310/bin/python
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            container: quay.io/pypa/manylinux2014_aarch64:latest
            interpreter: /opt/python/cp310-cp310/bin/python
          - os: macos-15-intel
            target: x86_64-apple-darwin
            container: ""
            interpreter: python
          - os: macos-15
            target: aarch64-apple-darwin
            container: ""
            interpreter: python
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            container: ""
            interpreter: python
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.target }}
          container: ${{ matrix.container }}
          manylinux: '2014'
          args: --release --locked --strip --out dist --interpreter ${{ matrix.interpreter }}
      - name: Test installed wheel on Python 3.10
        shell: bash
        run: |
          python -m pip install dist/*.whl 'pytest>=8,<10'
          python -m pytest -q
          rushstats --version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Test same wheel on Python 3.14
        shell: bash
        run: |
          python -m pip install dist/*.whl 'pytest>=8,<10'
          python -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
  sdist:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install 'maturin==1.15.0' 'twine>=6,<7' 'pytest>=8,<10'
      - run: python scripts/check_release.py
      - run: maturin sdist --out dist
      - name: Rebuild and test from source archive
        shell: bash
        run: |
          python -m pip wheel --no-deps --no-build-isolation dist/*.tar.gz --wheel-dir wheelhouse
          python -m pip install wheelhouse/*.whl
          python -m pytest -q
          python -m twine check dist/*.tar.gz wheelhouse/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
