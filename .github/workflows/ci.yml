name: tests
on: [push, pull_request]
env:
  PYTHONUTF8: "1"
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python -m pip install maturin pytest ruff
      - run: cargo test --locked
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: ruff check python tests examples
      - run: ruff format --check python tests examples
      - run: maturin build --release --locked
      - name: Install actual wheel
        shell: bash
        run: python -m pip install target/wheels/rushstats-*.whl
      - run: python -m pytest -q
      - run: rushstats examples/customers.csv --all -o smoke.md
      - run: maturin sdist
