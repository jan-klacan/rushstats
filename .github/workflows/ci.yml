name: tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: "1"
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python -m pip install maturin pytest ruff
      - run: cargo test --locked
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: ruff check python tests examples scripts
      - run: ruff format --check python tests examples scripts
      - run: maturin build --release --locked
      - name: Install actual wheel
        shell: bash
        run: python -m pip install target/wheels/rushstats-*.whl
      - run: python -m pytest -q
      - run: rushstats examples/customers.csv --all -o smoke.md
      - run: maturin sdist

  release-metadata:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python scripts/check_release.py
      - uses: docker://rhysd/actionlint:1.7.12
  container:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: docker build -t rushstats:ci .
      - run: python scripts/smoke_container.py --image rushstats:ci
