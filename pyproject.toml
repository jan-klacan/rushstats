[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "rushstats"
version = "0.3.0"
description = "Deterministic CSV statistical reports powered by Rust"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["csv", "statistics", "cli", "markdown", "rust"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/jan-klacan/rushstats"
Documentation = "https://github.com/jan-klacan/rushstats#readme"
Issues = "https://github.com/jan-klacan/rushstats/issues"
Changelog = "https://github.com/jan-klacan/rushstats/blob/main/CHANGELOG.md"
Source = "https://github.com/jan-klacan/rushstats"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "maturin>=1.14,<2"]

[project.scripts]
rushstats = "rushstats.cli:main"

[tool.maturin]
python-source = "python"
module-name = "rushstats._core"

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
